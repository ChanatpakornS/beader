name: Release debug APK

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_notes:
        description: "Release notes body (Markdown). Leave blank for a default summary."
        required: false
        type: string

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build and publish debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Assemble debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Determine release tag
        id: tag
        run: echo "tag=debug-$(date -u +%Y%m%d%H%M%S)-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release with APK attached
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES_INPUT: ${{ inputs.release_notes }}
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
          DEFAULT_NOTES: |
            Debug build from this commit.

            Debug-signed (default debug keystore) — install for testing only, not a production release.
        run: |
          NOTES="${NOTES_INPUT:-$DEFAULT_NOTES}"
          gh release create "$RELEASE_TAG" \
            app/build/outputs/apk/debug/app-debug.apk \
            --title "Debug build $RELEASE_TAG" \
            --notes "$NOTES" \
            --prerelease \
            --target "$GITHUB_SHA"
