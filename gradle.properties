# Project-wide Gradle settings.

# JVM heap and metaspace tuning for the Gradle daemon.
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8 -XX:+HeapDumpOnOutOfMemoryError

# Enable parallel project execution, build caching and configuration caching
# for significantly faster local and CI builds.
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.configureondemand=true

# Kotlin
kotlin.code.style=official
kotlin.incremental=true

# AndroidX
android.useAndroidX=true
android.nonTransitiveRClass=true
android.nonFinalResIds=true

# Suppress unsupported compileSdk / Kotlin-AGP compatibility warnings so CI
# output stays readable; remove once toolchains have all caught up.
android.suppressUnsupportedCompileSdk=35
